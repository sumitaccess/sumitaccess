# ============================================================================
# SkillSwap — Render Blueprint
# Deploy: connect this repo on render.com → Blueprint auto-detects this file.
# The app boots with a self-initialising SQLite database (schema + demo seed
# run automatically), so there is ZERO manual setup.
# ============================================================================

services:
  - type: web
    name: skillswap
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # node:sqlite needs Node 22.13+ (unflagged)
      - key: NODE_VERSION
        value: 22.14.0
      # Auth.js derives the origin from the request host (works on the
      # render.onrender.com domain). NEXTAUTH_URL intentionally stays unset.
      - key: AUTH_TRUST_HOST
        value: "true"
      # Generate a strong random secret on first deploy
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: file:./dev.db
      # Demo accounts (demo@skillswap.app / demo1234, admin@skillswap.app / admin1234)
      - key: DEMO_PASSWORD
        value: demo1234
      - key: ADMIN_PASSWORD
        value: admin1234
      # Optional: set a Resend API key to send real OTP / reset emails.
      # Without it, emails are logged to the service logs (dev sink).
      - key: RESEND_API_KEY
        sync: false
