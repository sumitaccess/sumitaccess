# Render.com deployment config
# https://render.com/docs/yaml-spec
services:
  - type: web
    name: bhoomi-trust
    runtime: node
    plan: free
    region: oregon
    branch: arena/019fda2d-sumitaccess
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
